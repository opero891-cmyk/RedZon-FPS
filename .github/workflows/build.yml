name: Build Android APK

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build project and release APK
        run: ./gradlew clean build assembleRelease

      - name: Rename release APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/redzon-pro-release.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: redzon-pro-release-apk
          path: app/build/outputs/apk/release/redzon-pro-release.apk
          if-no-files-found: error
